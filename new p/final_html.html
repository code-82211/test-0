<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه فرم</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">



</head>

<body>

    <div class="container-fluid">

        <!-- Sidebar -->
        <div class="sidebar">
            <ul>
                <li id="menu-1" class="active">
                    <span class="menu-icon"><i class="bi bi-grid-fill"></i></span>
                    <span>1. پیشخوان</span>
                </li>
                <li id="menu-2">
                    <span class="menu-icon"><i class="bi bi-ticket-perforated"></i></span>
                    <span>تیکت ها</span>
                </li>
                <li id="menu-3">
                    <span class="menu-icon"><i class="bi bi-box-seam"></i></span>
                    <span>دارایی ها</span>
                </li>
                <li id="menu-4">
                    <span class="menu-icon"><i class="bi bi-people"></i></span>
                    <span>کاربران</span>
                </li>

            </ul>
        </div>

        <!-- Content area -->
        <div class="content-area">

            <header class="topbar">
                <h2 class="topbar-title">سیستم مدیریت خدمات سازمان</h2>

                <div class="topbar-user">
                    <span>مدیر سیستم</span>
                    <span class="user-icon"><i class="bi bi-person-circle"></i></span>
                </div>
            </header>

            <div class="tab-content">
                <div id="step1" class="container-fluid tab-pane  active">
                    <!-- Main -->
                    <div class="main-content">

                        <div class="page-heading">
                            <h1>گزارشات امروز</h1>
                            <a href="../final project - Copy/final_html.html">
                                <button class="btn btn-success">ثبت درخواست +</button>
                            </a>
                        </div>

                        <!-- Cards -->

                        <form class="nrow">



                            <label class="content bg-info">
                                <div class="row align-content-center justify-content-center">


                                    <div class="col-md-8">
                                        <p class="card-header">تیکت های باز</p>

                                        <h3 class="counter" id="t1">
                                            13
                                        </h3>

                                    </div>

                                    <div class="col-md-4">
                                        <input class="card" id="rad1" type="radio" name="service" value="network">

                                        <span class="card-icon"><i class="bi bi-ticket-perforated"></i></span>
                                    </div>

                                </div>
                            </label>



                            <label class="content bg-danger">

                                <input class="card" id="rad2" type="radio" name="service" value="license">

                                <span class="card-icon"><i class="bi bi-database"></i></span>

                                <p class="card-header">سرویس های آنلاین</p>

                                <h3 class="counter" id="t2">
                                    48
                                </h3>

                            </label>



                            <label class="content bg-success">

                                <input class="card" id="rad3" type="radio" name="service" value="hardware">

                                <span class="card-icon"><i class="bi bi-cpu"></i></span>

                                <p class="card-header">تجهیزات تخصیص یافته</p>

                                <h3 class="counter" id="t3">
                                    105
                                </h3>
                            </label>

                            <label class="content bg-warning">

                                <input class="card" id="rad4" type="radio" name="service" value="errors">

                                <span class="card-icon"><i class="bi bi-exclamation-triangle"></i></span>

                                <p class="card-header">خطا های گزارش شده</p>

                                <h3 class="counter" id="t4">
                                    3
                                </h3>

                            </label>


                        </form>





                    </div>


                </div>
                <div id="step2" class="container tab-pane  fade">

                    <div class="main-content">
                        <h1> تکمیل اطلاعات</h1>
                        <p>آی پی درخواستی(اختیاری)</p>
                        <input id="ipinp" type="text" class="searchbox" placeholder="192.168.1.1">
                        <p>محدوده شبکه</p>
                        <input id="ntwk" class="searchbox" placeholder="مدیریت" list="net">


                        <datalist id="net">
                            <option value="مدیریت">
                            <option value="گزینه های دیگر">

                        </datalist>

                    </div>

                    <div class="btn-box">
                        <button class="btn prevbtn  btn-outline-secondary" onclick="pastStep(2)"
                            type="button">قبلی</button>
                        <button class="btn btn-outline-primary" onclick="nextStep(2)" type="button">بعدی</button>
                    </div>
                </div>
                <div id="step3" class="container tab-pane  fade">
                    <h1>خلاصه درخواست</h1>

                    <p><strong>سرویس درخواستی:</strong> <span id="resultService">-</span></p>

                    <p><strong>IP درخواستی:</strong> <span id="resultIP">-</span></p>

                    <p><strong>محدوده شبکه:</strong> <span id="resultNet">-</span></p>
                    <div class="btn-box">
                        <button class="btn prevbtn  btn-outline-secondary " onclick="pastStep(3)"
                            type="button">قبلی</button>
                        <button class="btn btn-primary disabled">ثبت نهایی</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
